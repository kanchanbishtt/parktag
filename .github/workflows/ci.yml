name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    # The security tests exercise real routes against a real database, because
    # the properties they pin (an operator object reaching a query filter, a
    # per-account lockout counter, a token's attempt cap) only exist at the
    # database boundary. The boot smoke test below also points at this URI, so
    # it now starts against a reachable Mongo rather than a dead port.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: dev
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB_NAME: wavetag
      # Must match the disposable-prefix rule in src/backend/tests/helpers.js —
      # the suite refuses to run against anything that isn't clearly throwaway.
      MONGODB_COLLECTION_PREFIX: ci_
      # Both register-call routes answer 503 when no virtual number is set, and a
      # runner has no telephony credentials. Without this the routes never write
      # a contact row, so every test that reads one back fails for a reason that
      # has nothing to do with what it is testing — which is what the scanner
      # location and callback suites have been failing on since 2026-08-27.
      #
      # Safe: nothing dials. These routes record where a call should be routed
      # and hand the number back; the number below is not a real Exotel line.
      # contact-routing.test.js already set this for itself at module scope,
      # which fixed that one file and left every other suite broken. Setting it
      # for the job fixes it once, for all of them.
      EXOTEL_CALLER_ID: "08000000000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: `node --test` only accepts glob patterns from 21 onward,
          # and the test script scopes discovery with one so that the manual
          # Exotel script at ./test.js is not picked up as a test.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check JS syntax
        run: |
          find src -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Login security tests
        run: npm test

      - name: Boot smoke test
        run: |
          PORT=4100 \
          APP_BASE_URL=http://localhost:4100 \
          node src/backend/server.js &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            if curl -sf http://localhost:4100/api/health > /dev/null; then
              echo "Server is up"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to become healthy"
          kill $SERVER_PID 2>/dev/null || true
          exit 1
