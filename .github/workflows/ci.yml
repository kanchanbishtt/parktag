name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

# Superseded PR commits do not need to finish. Push runs use unique groups so
# a newer commit never cancels verification of a main/staging release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      landing: ${{ steps.scope.outputs.landing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out what changed
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # A new branch, a force push, or a squash-merge can leave a base that
          # is absent or all-zeroes. Every one of those means we cannot prove
          # what changed — so run everything. The failure mode of this step must
          # be "too many tests", never "too few".
          if [ -z "$BASE" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Base commit unavailable — running the full suite."
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "landing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          # .github/ is in the backend set so a change to this very workflow can
          # never talk its way out of being tested by the rules it just edited.
          if echo "$CHANGED" | grep -qE '^(src/|package\.json|package-lock\.json|\.github/)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED" | grep -qE '^landing/'; then
            echo "landing=true" >> "$GITHUB_OUTPUT"
          else
            echo "landing=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend tests (${{ matrix.shard }}/3)
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Each shard has a separate runner AND Mongo container. Keep test files
    # sequential within a shard: some suites clear whole fixture collections.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: dev
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB_NAME: wavetag_ci_${{ matrix.shard }}
      MONGODB_COLLECTION_PREFIX: ci_
      # Placeholder only; tests record routing without calling real handsets.
      EXOTEL_CALLER_ID: "08000000000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check JS syntax
        if: matrix.shard == 1
        run: find src -name "*.js" -print0 | xargs -0 -n1 node --check
      - name: Backend tests
        run: node --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/3 "src/backend/tests/**/*.test.js"
      - name: Boot smoke test
        if: matrix.shard == 1
        run: |
          PORT=4100 APP_BASE_URL=http://localhost:4100 node src/backend/server.js &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 10); do
            if curl -sf http://localhost:4100/api/health > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to become healthy"
          exit 1

  landing:
    name: Landing build
    needs: scope
    if: needs.scope.outputs.landing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
        working-directory: landing
      - run: npx next build
        working-directory: landing

  # Preserve the existing required check name. A failed/cancelled prerequisite
  # must never turn into a passing gate, even when another job was skipped.
  verify:
    needs: [scope, backend, landing]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          BACKEND_REQUIRED: ${{ needs.scope.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          LANDING_REQUIRED: ${{ needs.scope.outputs.landing }}
          LANDING_RESULT: ${{ needs.landing.result }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$BACKEND_REQUIRED:$BACKEND_RESULT" in
            true:success|false:skipped) ;;
            *) echo "Backend checks did not complete as required"; exit 1 ;;
          esac
          case "$LANDING_REQUIRED:$LANDING_RESULT" in
            true:success|false:skipped) ;;
            *) echo "Landing checks did not complete as required"; exit 1 ;;
          esac
