<!-- @dsCard group="Brand" viewport="700x260" name="The E-Tag sticker" subtitle="The physical artefact the whole product hangs on — use the real artwork" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px 18px; background: var(--surface-card); font-family: var(--font-ui); color: var(--text-strong); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { display: grid; gap: 6px; }
  .chip { width: 96px; height: 52px; border-radius: var(--radius-md); }
  .name { font-size: 10px; font-weight: 700; letter-spacing: 0.02em; }
  .hex { font-family: var(--font-plate); font-size: 9.5px; color: var(--text-admin-muted); }
  .cap { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-admin-faint); font-weight: 700; }
  
</style>
</head>
<body>
<div style="display:flex;gap:16px;align-items:center">
  <img src="../assets/stickers/parktag-sticker.png" alt="ParkTag sticker" style="width:340px;border-radius:var(--radius-lg);border:1px solid var(--border-admin)" />
  <div style="font-size:11.5px;line-height:1.75;color:var(--text-muted);max-width:280px">
    <p style="margin:0 0 8px"><strong style="color:var(--text-strong)">Two halves:</strong> white instruction panel, red QR panel. Printed 4-up on landscape A4.</p>
    <p style="margin:0 0 8px">The QR sits on white inside the red panel with 10px padding and a 12px radius — nothing overlaps it.</p>
    <p style="margin:0">Sticker artwork lives in <code style="font-family:var(--font-plate)">assets/stickers/</code>. Never rebuild it in HTML or redraw the QR frame.</p>
  </div>
</div>
</body></html>
