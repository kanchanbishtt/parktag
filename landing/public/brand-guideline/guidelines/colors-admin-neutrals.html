<!-- @dsCard group="Colors" viewport="700x160" name="Admin neutrals" subtitle="A cooler, tighter grey ramp for the console" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px 18px; background: var(--surface-card); font-family: var(--font-ui); color: var(--text-strong); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { display: grid; gap: 6px; }
  .chip { width: 96px; height: 52px; border-radius: var(--radius-md); }
  .name { font-size: 10px; font-weight: 700; letter-spacing: 0.02em; }
  .hex { font-family: var(--font-plate); font-size: 9.5px; color: var(--text-admin-muted); }
  .cap { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-admin-faint); font-weight: 700; }
  
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--pt-admin-bg);border:1px solid var(--border-admin);"></div><span class="name">admin-bg</span><span class="hex">#F8F9FA</span></div>
  <div class="sw"><div class="chip" style="background:var(--pt-gray-50);border:1px solid var(--border-admin);"></div><span class="name">gray-50</span><span class="hex">#FAFBFC</span></div>
  <div class="sw"><div class="chip" style="background:var(--pt-gray-100);"></div><span class="name">gray-100</span><span class="hex">#F3F4F6</span></div>
  <div class="sw"><div class="chip" style="background:var(--pt-gray-200);"></div><span class="name">gray-200</span><span class="hex">#E5E7EB</span></div>
  <div class="sw"><div class="chip" style="background:var(--pt-gray-400);"></div><span class="name">gray-400</span><span class="hex">#9CA3AF</span></div>
  <div class="sw"><div class="chip" style="background:var(--pt-gray-500);"></div><span class="name">gray-500</span><span class="hex">#6B7280</span></div>
  <div class="sw"><div class="chip" style="background:var(--pt-gray-700);"></div><span class="name">gray-700</span><span class="hex">#374151</span></div>
  <div class="sw"><div class="chip" style="background:var(--pt-gray-900);"></div><span class="name">gray-900</span><span class="hex">#323232</span></div>
</div>
</body></html>
