<!-- @dsCard group="Colors" viewport="700x140" name="Contact channels" subtitle="WhatsApp green and masked-call navy are channel identity, not palette" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px 18px; background: var(--surface-card); font-family: var(--font-ui); color: var(--text-strong); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { display: grid; gap: 6px; }
  .chip { width: 96px; height: 52px; border-radius: var(--radius-md); }
  .name { font-size: 10px; font-weight: 700; letter-spacing: 0.02em; }
  .hex { font-family: var(--font-plate); font-size: 9.5px; color: var(--text-admin-muted); }
  .cap { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-admin-faint); font-weight: 700; }
  
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--pt-whatsapp);"></div><span class="name">whatsapp</span><span class="hex">#25D366</span></div>
  <div class="sw"><div class="chip" style="background:var(--pt-whatsapp-dark);"></div><span class="name">whatsapp-dark</span><span class="hex">#128C7E</span></div>
  <div class="sw"><div class="chip" style="width:200px;background:var(--pt-gradient-whatsapp)"></div><span class="name">gradient-whatsapp</span><span class="hex">135deg · 25D366 → 128C7E</span></div>
  <div class="sw"><div class="chip" style="width:200px;background:var(--pt-gradient-call)"></div><span class="name">gradient-call</span><span class="hex">135deg · 03162D → 162F60</span></div>
</div>
</body></html>
