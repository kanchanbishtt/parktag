<!-- @dsCard group="Colors" viewport="700x180" name="Gradients" subtitle="Four fixed gradients — header, hero, plate, activation shell" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px 18px; background: var(--surface-card); font-family: var(--font-ui); color: var(--text-strong); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { display: grid; gap: 6px; }
  .chip { width: 96px; height: 52px; border-radius: var(--radius-md); }
  .name { font-size: 10px; font-weight: 700; letter-spacing: 0.02em; }
  .hex { font-family: var(--font-plate); font-size: 9.5px; color: var(--text-admin-muted); }
  .cap { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-admin-faint); font-weight: 700; }
  .g { height: 62px; border-radius: var(--radius-lg); }
</style>
</head>
<body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
  <div class="sw"><div class="g" style="background:var(--pt-gradient-header)"></div><span class="name">header</span><span class="hex">135deg navy</span></div>
  <div class="sw"><div class="g" style="background:var(--pt-gradient-hero)"></div><span class="name">hero</span><span class="hex">145deg navy → plum</span></div>
  <div class="sw"><div class="g" style="background:var(--pt-gradient-plate)"></div><span class="name">plate</span><span class="hex">135deg 03162D → 0A2040</span></div>
  <div class="sw"><div class="g" style="background:var(--pt-gradient-activate)"></div><span class="name">activate shell</span><span class="hex">radial red + blue wash</span></div>
</div>
<p style="margin:12px 0 0;font-size:11px;color:var(--text-admin-muted)">No other gradients. Never gradient a body background or a card fill.</p>
</body></html>
