<!-- @dsCard group="Colors" viewport="700x140" name="Navy" subtitle="Ink, header chrome, plate gradients" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px 18px; background: var(--surface-card); font-family: var(--font-ui); color: var(--text-strong); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { display: grid; gap: 6px; }
  .chip { width: 96px; height: 52px; border-radius: var(--radius-md); }
  .name { font-size: 10px; font-weight: 700; letter-spacing: 0.02em; }
  .hex { font-family: var(--font-plate); font-size: 9.5px; color: var(--text-admin-muted); }
  .cap { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-admin-faint); font-weight: 700; }
  
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--pt-navy-900);"></div><span class="name">navy-900</span><span class="hex">#010D1A</span></div>
  <div class="sw"><div class="chip" style="background:var(--pt-navy-800);"></div><span class="name">navy-800 · ink</span><span class="hex">#03162D</span></div>
  <div class="sw"><div class="chip" style="background:var(--pt-navy-700);"></div><span class="name">navy-700</span><span class="hex">#0B2244</span></div>
  <div class="sw"><div class="chip" style="background:var(--pt-navy-600);"></div><span class="name">navy-600</span><span class="hex">#0A2040</span></div>
  <div class="sw"><div class="chip" style="background:var(--pt-navy-500);"></div><span class="name">navy-500</span><span class="hex">#162F60</span></div>
  <div class="sw"><div class="chip" style="background:var(--pt-navy-300);"></div><span class="name">navy-300 · sub</span><span class="hex">#495B7B</span></div>
</div>
</body></html>
