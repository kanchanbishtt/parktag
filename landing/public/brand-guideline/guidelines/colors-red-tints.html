<!-- @dsCard group="Colors" viewport="700x140" name="Red tints" subtitle="Icon tiles, active nav, notice banners, consent panels" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px 18px; background: var(--surface-card); font-family: var(--font-ui); color: var(--text-strong); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { display: grid; gap: 6px; }
  .chip { width: 96px; height: 52px; border-radius: var(--radius-md); }
  .name { font-size: 10px; font-weight: 700; letter-spacing: 0.02em; }
  .hex { font-family: var(--font-plate); font-size: 9.5px; color: var(--text-admin-muted); }
  .cap { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-admin-faint); font-weight: 700; }
  
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--pt-red-250);"></div><span class="name">red-250</span><span class="hex">#FFD8D0</span></div>
  <div class="sw"><div class="chip" style="background:var(--pt-red-200);"></div><span class="name">red-200</span><span class="hex">#FFE3DD</span></div>
  <div class="sw"><div class="chip" style="background:var(--pt-red-150);"></div><span class="name">red-150</span><span class="hex">#FFEDEA</span></div>
  <div class="sw"><div class="chip" style="background:var(--pt-red-100);"></div><span class="name">red-100</span><span class="hex">#FFF2EF</span></div>
  <div class="sw"><div class="chip" style="background:var(--pt-red-50);border:1px solid var(--border-admin);"></div><span class="name">red-50</span><span class="hex">#FFF5F3</span></div>
</div>
</body></html>
