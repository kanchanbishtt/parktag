<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Green = verified identity only. Red text = error, red fill = action." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px 18px; background: var(--surface-card); font-family: var(--font-ui); color: var(--text-strong); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { display: grid; gap: 6px; }
  .chip { width: 96px; height: 52px; border-radius: var(--radius-md); }
  .name { font-size: 10px; font-weight: 700; letter-spacing: 0.02em; }
  .hex { font-family: var(--font-plate); font-size: 9.5px; color: var(--text-admin-muted); }
  .cap { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-admin-faint); font-weight: 700; }
  
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--pt-success);"></div><span class="name">success</span><span class="hex">#047857</span></div>
  <div class="sw"><div class="chip" style="background:var(--pt-success-bg);border:1px solid var(--border-admin);"></div><span class="name">success-bg</span><span class="hex">#ECFDF5</span></div>
  <div class="sw"><div class="chip" style="background:var(--pt-danger);"></div><span class="name">danger</span><span class="hex">#DC2626</span></div>
  <div class="sw"><div class="chip" style="background:var(--pt-danger-bg);"></div><span class="name">danger-bg</span><span class="hex">#FEE2E2</span></div>
  <div class="sw"><div class="chip" style="background:var(--pt-warn);"></div><span class="name">warn</span><span class="hex">#92400E</span></div>
  <div class="sw"><div class="chip" style="background:var(--pt-warn-bg);"></div><span class="name">warn-bg</span><span class="hex">#FEF3C7</span></div>
</div>
<p style="margin:12px 0 0;font-size:11px;color:var(--text-admin-muted)">Quirk to preserve: form success messages are printed in the brand red, not green.</p>
</body></html>
