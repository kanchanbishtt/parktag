<!-- @dsCard group="Spacing" viewport="700x160" name="Elevation · admin &amp; action" subtitle="The console gets one hairline lift; coloured shadows belong to buttons" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px 18px; background: var(--surface-card); font-family: var(--font-ui); color: var(--text-strong); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { display: grid; gap: 6px; }
  .chip { width: 96px; height: 52px; border-radius: var(--radius-md); }
  .name { font-size: 10px; font-weight: 700; letter-spacing: 0.02em; }
  .hex { font-family: var(--font-plate); font-size: 9.5px; color: var(--text-admin-muted); }
  .cap { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-admin-faint); font-weight: 700; }
  .e { height: 62px; border-radius: var(--radius-card-admin); background: #fff; }
</style>
</head>
<body>
<div style="background:var(--pt-admin-bg);margin:-16px -18px;padding:20px 18px"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
  <div class="sw"><div class="e" style="border:1px solid var(--border-admin);box-shadow:var(--shadow-admin-card)"></div><span class="name">admin-card</span><span class="hex">0 1 3 / .05</span></div>
  <div class="sw"><div class="e" style="background:var(--accent);box-shadow:var(--shadow-accent)"></div><span class="name">accent</span><span class="hex">0 4 16 red/.35</span></div>
  <div class="sw"><div class="e" style="background:var(--pt-gradient-whatsapp);box-shadow:var(--shadow-whatsapp)"></div><span class="name">whatsapp</span><span class="hex">0 6 24 green/.38</span></div>
  <div class="sw"><div class="e" style="background:var(--pt-gradient-call);box-shadow:var(--shadow-call)"></div><span class="name">call</span><span class="hex">0 6 24 navy/.32</span></div>
</div></div>
</body></html>
