<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation · owner" subtitle="Wide navy-tinted lifts; two shadows stacked on the main card" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px 18px; background: var(--surface-card); font-family: var(--font-ui); color: var(--text-strong); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { display: grid; gap: 6px; }
  .chip { width: 96px; height: 52px; border-radius: var(--radius-md); }
  .name { font-size: 10px; font-weight: 700; letter-spacing: 0.02em; }
  .hex { font-family: var(--font-plate); font-size: 9.5px; color: var(--text-admin-muted); }
  .cap { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-admin-faint); font-weight: 700; }
  .e { background: #fff; border-radius: var(--radius-4xl); height: 74px; }
</style>
</head>
<body>
<div style="background:var(--pt-bg);margin:-16px -18px;padding:22px 18px"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
  <div class="sw"><div class="e" style="box-shadow:var(--shadow-soft)"></div><span class="name">soft</span><span class="hex">0 4 24 / .08</span></div>
  <div class="sw"><div class="e" style="box-shadow:var(--shadow-card);border:1px solid var(--border-hairline)"></div><span class="name">card</span><span class="hex">0 2 8 + 0 12 36</span></div>
  <div class="sw"><div class="e" style="box-shadow:var(--shadow-lg)"></div><span class="name">lg</span><span class="hex">0 8 40 / .12</span></div>
  <div class="sw"><div class="e" style="box-shadow:var(--shadow-premium);border:1px solid var(--border-strong)"></div><span class="name">premium</span><span class="hex">0 18 42 / .10</span></div>
</div></div>
</body></html>
