<!-- @dsCard group="Spacing" viewport="700x170" name="Corner radii" subtitle="Admin chrome stays tight; owner surfaces get rounder as they get calmer" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px 18px; background: var(--surface-card); font-family: var(--font-ui); color: var(--text-strong); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { display: grid; gap: 6px; }
  .chip { width: 96px; height: 52px; border-radius: var(--radius-md); }
  .name { font-size: 10px; font-weight: 700; letter-spacing: 0.02em; }
  .hex { font-family: var(--font-plate); font-size: 9.5px; color: var(--text-admin-muted); }
  .cap { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-admin-faint); font-weight: 700; }
  .r { width: 74px; height: 50px; background: var(--pt-bg); border: 1.5px solid var(--border-default); }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="r" style="border-radius:8px"></div><span class="name">8px</span><span class="hex">admin button</span></div><div class="sw"><div class="r" style="border-radius:10px"></div><span class="name">10px</span><span class="hex">input</span></div><div class="sw"><div class="r" style="border-radius:12px"></div><span class="name">12px</span><span class="hex">chip / banner</span></div><div class="sw"><div class="r" style="border-radius:14px"></div><span class="name">14px</span><span class="hex">button · admin card</span></div><div class="sw"><div class="r" style="border-radius:16px"></div><span class="name">16px</span><span class="hex">soft card</span></div><div class="sw"><div class="r" style="border-radius:18px"></div><span class="name">18px</span><span class="hex">step item</span></div><div class="sw"><div class="r" style="border-radius:20px"></div><span class="name">20px</span><span class="hex">card</span></div><div class="sw"><div class="r" style="border-radius:24px"></div><span class="name">24px</span><span class="hex">sticker</span></div><div class="sw"><div class="r" style="border-radius:26px"></div><span class="name">26px</span><span class="hex">premium card</span></div>
  <div class="sw"><div class="r" style="border-radius:999px"></div><span class="name">999px</span><span class="hex">badges</span></div>
</div>
</body></html>
