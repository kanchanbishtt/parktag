<!-- @dsCard group="Type" viewport="700x200" name="Display scale" subtitle="Headlines run 800–900 with negative tracking" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px 18px; background: var(--surface-card); font-family: var(--font-ui); color: var(--text-strong); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { display: grid; gap: 6px; }
  .chip { width: 96px; height: 52px; border-radius: var(--radius-md); }
  .name { font-size: 10px; font-weight: 700; letter-spacing: 0.02em; }
  .hex { font-family: var(--font-plate); font-size: 9.5px; color: var(--text-admin-muted); }
  .cap { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-admin-faint); font-weight: 700; }
  p { margin: 0; font-family: var(--font-display); }
</style>
</head>
<body>
<div style="display:grid;gap:8px">
  <p style="font-size:var(--text-4xl-plus);font-weight:900;letter-spacing:-0.02em">1.75rem / 900 · page title</p>
  <p style="font-size:var(--text-3xl);font-weight:900">1.5rem / 900 · auth card title</p>
  <p style="font-size:var(--text-2xl-plus);font-weight:800;letter-spacing:-0.03em">1.4rem / 800 · card title</p>
  <p style="font-size:var(--text-xl);font-weight:800">1.15rem / 800 · logo lockup</p>
  <p style="font-size:var(--text-lg);font-weight:800">1rem / 800 · admin card title</p>
</div>
</body></html>
