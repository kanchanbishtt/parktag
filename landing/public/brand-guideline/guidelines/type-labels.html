<!-- @dsCard group="Type" viewport="700x160" name="Eyebrows &amp; section labels" subtitle="Uppercase, 800, tracked — the only uppercase text in the system" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px 18px; background: var(--surface-card); font-family: var(--font-ui); color: var(--text-strong); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { display: grid; gap: 6px; }
  .chip { width: 96px; height: 52px; border-radius: var(--radius-md); }
  .name { font-size: 10px; font-weight: 700; letter-spacing: 0.02em; }
  .hex { font-family: var(--font-plate); font-size: 9.5px; color: var(--text-admin-muted); }
  .cap { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-admin-faint); font-weight: 700; }
  
</style>
</head>
<body>
<div style="display:grid;gap:14px">
  <div>
    <p style="margin:0;font-size:var(--text-xs);font-weight:800;text-transform:uppercase;letter-spacing:var(--tracking-eyebrow);color:var(--accent)">Batch Issuance</p>
    <p style="margin:4px 0 0;font-family:var(--font-display);font-size:var(--text-4xl-plus);font-weight:900">Generate QR tags</p>
  </div>
  <div style="display:flex;gap:26px">
    <span style="font-size:var(--text-sm);font-weight:800;text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-muted)">Your vehicle details</span>
    <span style="font-size:var(--text-sm-plus);font-weight:800;text-transform:uppercase;letter-spacing:var(--tracking-eyebrow-wide);color:var(--accent-ink)">Owner details</span>
    <span style="font-size:var(--text-2xs);font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-admin-faint)">Management</span>
  </div>
</div>
</body></html>
