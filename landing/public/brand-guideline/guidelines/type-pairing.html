<!-- @dsCard group="Type" viewport="700x180" name="Font pairing" subtitle="Metropolis display over Google Sans UI (Poppins / DM Sans stand-ins)" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px 18px; background: var(--surface-card); font-family: var(--font-ui); color: var(--text-strong); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { display: grid; gap: 6px; }
  .chip { width: 96px; height: 52px; border-radius: var(--radius-md); }
  .name { font-size: 10px; font-weight: 700; letter-spacing: 0.02em; }
  .hex { font-family: var(--font-plate); font-size: 9.5px; color: var(--text-admin-muted); }
  .cap { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-admin-faint); font-weight: 700; }
  
</style>
</head>
<body>
<div style="display:grid;gap:14px">
  <div>
    <span class="cap">Display · var(--font-display)</span>
    <p style="margin:4px 0 0;font-family:var(--font-display);font-size:34px;font-weight:900;letter-spacing:-0.03em;line-height:1">Vehicle contact, done privately.</p>
  </div>
  <div>
    <span class="cap">UI · var(--font-ui)</span>
    <p style="margin:4px 0 0;font-size:14px;line-height:1.6;color:var(--text-muted);max-width:52ch">ParkTag lets people reach your vehicle owner anonymously. No numbers shared, no hassle.</p>
  </div>
</div>
</body></html>
