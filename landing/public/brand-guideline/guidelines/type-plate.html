<!-- @dsCard group="Type" viewport="700x160" name="Plate type" subtitle="Courier New, 900, 0.13em — vehicle numbers and tag IDs only" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px 18px; background: var(--surface-card); font-family: var(--font-ui); color: var(--text-strong); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { display: grid; gap: 6px; }
  .chip { width: 96px; height: 52px; border-radius: var(--radius-md); }
  .name { font-size: 10px; font-weight: 700; letter-spacing: 0.02em; }
  .hex { font-family: var(--font-plate); font-size: 9.5px; color: var(--text-admin-muted); }
  .cap { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-admin-faint); font-weight: 700; }
  
</style>
</head>
<body>
<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
  <span style="font-family:var(--font-plate);font-weight:900;font-size:var(--text-2xl-plus);letter-spacing:var(--tracking-plate);color:#fff;background:var(--pt-gradient-plate);border-radius:var(--radius-md);padding:8px 16px;border:1.5px solid rgba(255,255,255,0.12);box-shadow:var(--shadow-plate);text-shadow:0 1px 3px rgba(0,0,0,0.4)">DL 8C AB 1234</span>
  <span style="font-family:var(--font-plate);font-weight:800;font-size:var(--text-3xl);letter-spacing:0.15em;padding:14px 20px;background:var(--pt-gray-100);border:2px dashed var(--border-default);border-radius:var(--radius-lg)">MH 12 XX 0000</span>
  <span style="font-family:var(--font-plate);font-size:var(--text-base);letter-spacing:0.04em;color:var(--text-muted)">PT-0042-9KQ</span>
</div>
</body></html>
