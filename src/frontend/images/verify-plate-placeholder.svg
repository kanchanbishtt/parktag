  <rect x="8" y="8" width="624" height="344" rx="14" fill="none" stroke="#C7CFDA" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- Car, front view, simplified -->
  <g fill="none" stroke="#98A4B5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 268V166c0-10 6-19 15-23l30-13c14-6 29-9 44-9h82c15 0 30 3 44 9l30 13c9 4 15 13 15 23v102"/>
