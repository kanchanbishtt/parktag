<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 224" width="640" height="224" role="img" aria-label="Placeholder: the last four digits of a vehicle plate, magnified">
  <!-- PLACEHOLDER ARTWORK — swap for the real photo/illustration.
       Deliberately plain and dashed so it cannot be mistaken for final art.
       640x224 is 20:7, matching the .pt-verify-media aspect ratio in
       styles.css. Drawn to that box rather than letterboxed into it, so
       `object-fit: cover` has nothing to crop. -->
  <defs>
    <clipPath id="vp-lens">
      <circle cx="452" cy="104" r="62"/>
    </clipPath>
  </defs>

  <rect width="640" height="224" fill="#EEF1F5"/>
  <rect x="8" y="8" width="624" height="208" rx="14" fill="none" stroke="#C7CFDA" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- Car, front view, simplified -->
  <g fill="none" stroke="#98A4B5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 176V96c0-8 5-15 12-18l24-10c11-5 23-7 35-7h66c12 0 24 2 35 7l24 10c7 3 12 10 12 18v80"/>
    <path d="M109 86l13-27c3-7 10-12 18-12h88c8 0 15 5 18 12l13 27"/>
    <path d="M80 176h48M240 176h48" stroke-width="9"/>
  </g>
  <rect x="94" y="116" width="42" height="16" rx="8" fill="#B7C1CE"/>
  <rect x="232" y="116" width="42" height="16" rx="8" fill="#B7C1CE"/>

  <!-- Number plate on the car -->
  <rect x="138" y="140" width="92" height="30" rx="5" fill="#FFFFFF" stroke="#8A97A8" stroke-width="3.5"/>
  <text x="184" y="162" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" font-weight="700" fill="#5B6675" letter-spacing="1">UK15D</text>

  <!-- Magnifier over the part that matters: the last four digits -->
  <circle cx="452" cy="104" r="62" fill="#FFFFFF"/>
  <g clip-path="url(#vp-lens)">
    <text x="452" y="120" text-anchor="middle" font-family="'Courier New', monospace" font-size="46" font-weight="700" fill="#0B1B33" letter-spacing="2">2366</text>
  </g>
  <circle cx="452" cy="104" r="62" fill="none" stroke="#0B1B33" stroke-width="6"/>
  <path d="M496 148l40 40" stroke="#0B1B33" stroke-width="12" stroke-linecap="round"/>

  <text x="320" y="207" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#98A4B5" letter-spacing="1.4">IMAGE PLACEHOLDER</text>
</svg>
