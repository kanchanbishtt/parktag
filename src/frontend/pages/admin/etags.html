<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ParkTag Admin | Tags</title>
  <style>
    * { box-sizing: border-box; }
    /* This page does not link /styles/styles.css, so it carries its own copy of
       the inherited overflow guard: E-Tag tokens, emails and ids have no space
       to break at and would otherwise push a card past the viewport. */
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: #F1F1F0; color: #03162D; overflow-wrap: break-word; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 18px 60px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    /* The real logo asset rather than a typed wordmark. width/height are on the
       tag as well, so the header does not reflow when the image lands. */
    /* The asset is a PNG with a solid white background, so on this page's grey
       ground it renders as a white box. `multiply` drops the white out and
       leaves the ink, which is the same trick the scan page header uses in
       reverse (`lighten`) for the dark logo on its dark bar. */
    .brand-logo { width: auto; height: 30px; aspect-ratio: 735 / 280; flex: 0 0 auto;
                  display: block; mix-blend-mode: multiply; }
    .title { font-size: 1.5rem; font-weight: 900; margin: 0; min-width: 0; }
    /* The dot separates the logo from the page name the way the wordmark used
       to, without needing a character in the markup. */
    .brand-sep { color: #9CA3AF; font-weight: 700; font-size: 1.2rem; }
    a.back { text-decoration: none; color: #6B7280; font-weight: 700; font-size: .85rem; border: 1.5px solid #E5E7EB; padding: 8px 14px; border-radius: 10px; background: #fff; }
    .bar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .bar input, .bar select { height: 42px; border: 1.5px solid #E5E7EB; border-radius: 10px; padding: 0 12px; font-size: .9rem; font-family: inherit; outline: none; }
    .bar input { flex: 1 1 260px; min-width: 0; }
    .bar select { flex: 0 0 auto; }
    /* Sized to its content and given the same 42px box as the controls beside
       it, so it reads as one of the filters instead of a stray line of text.
       It used to be an inline-styled label with no sizing at all, which took a
       whole flex row to itself the moment the bar wrapped. */
    .check { display: inline-flex; align-items: center; gap: 8px; flex: 0 0 auto;
             height: 42px; padding: 0 14px; border: 1.5px solid #E5E7EB; border-radius: 10px;
             background: #fff; font-size: .82rem; font-weight: 700; color: #6B7280;
             white-space: nowrap; cursor: pointer; user-select: none; }
    .check:hover { border-color: #D1D5DB; color: #374151; }
    .check input { width: 16px; height: 16px; margin: 0; accent-color: #FF2700; cursor: pointer; }
    .bar input:focus, .bar select:focus { border-color: #FF2700; }
    .summary { font-size: .82rem; color: #6B7280; margin: 0 0 10px; }
    .card { background: #fff; border: 1px solid #E5E7EB; border-radius: 14px; overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .84rem; min-width: 860px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #F1F2F4; white-space: nowrap; }
    /* Two short lines instead of one long one, so the column stops driving the
       table wider than the card that holds it. */
    .stamp .muted { display: block; font-size: .76rem; }
    th { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: #9CA3AF; background: #FAFBFC; }
    tr:last-child td { border-bottom: none; }
    .plate { font-weight: 800; letter-spacing: .04em; }
    .muted { color: #6B7280; }
    .pill { display: inline-block; font-size: .68rem; font-weight: 800; padding: 2px 9px; border-radius: 20px; }
    .pill.active { background: #FFE3DD; color: #B31C00; }
    .pill.inactive { background: #FEE2E2; color: #B91C1C; }
    .pill.premium { background: #FEF3C7; color: #92400E; }
    .pill.free { background: #FFE3DD; color: #3730A3; }
    .pill.del { background: #F3F4F6; color: #6B7280; }
    .act { display: inline-flex; gap: 6px; }
    .act button { border: 1.5px solid #E5E7EB; background: #fff; border-radius: 8px; padding: 5px 10px; font-size: .75rem; font-weight: 700; cursor: pointer; font-family: inherit; color: #374151; }
    .act button:hover { background: #F1F1F0; }
    .act button.danger { color: #B91C1C; border-color: #FCA5A5; }
    .act button.go { color: #FF2700; border-color: #FFB6A8; }
    .empty, .err { text-align: center; padding: 40px 16px; color: #6B7280; }
    /* logs modal */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
    .overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 16px; max-width: 720px; width: 100%; max-height: 85vh; overflow: auto; padding: 20px; }
    .modal h2 { margin: 0 0 4px; font-size: 1.1rem; }
    .modal .sub { color: #6B7280; font-size: .82rem; margin: 0 0 14px; }
    .log { border: 1px solid #EEF0F2; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: .8rem; }
    .log b { font-weight: 800; }
    .closex { float: right; border: none; background: #F3F4F6; border-radius: 8px; width: 30px; height: 30px; cursor: pointer; font-size: 1rem; }

    /* ── Narrow screens: stack each row into a labelled card ──
       This table is the widest in the admin (min-width: 860px), so on a phone
       it was a single sideways-scrolling strip. Same treatment activations.html
       already uses; the breakpoint sits just above that 860px min-width so the
       swap happens exactly where the table would start to overflow. The
       `data-label` on each cell is emitted by scripts/admin/etags.js. ── */
    @media (max-width: 900px) {
      .wrap { padding: 16px 14px 60px; }
      .title { font-size: 1.28rem; }
      .brand-logo { height: 26px; }
      /* >=16px keeps iOS from zooming the page on focus; 44px is the touch
         target. The bar still fits on ONE row here — it only wraps further
         down, at 700px, where the four controls genuinely stop fitting. */
      .bar input, .bar select, .check { height: 44px; font-size: 16px; }

      .card { background: transparent; border: none; overflow: visible; border-radius: 0; }
      table, tbody, tr, td { display: block; width: 100%; }
      table { min-width: 0; }
      thead { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
      tr { background: #fff; border: 1px solid #E5E7EB; border-radius: 14px; margin-bottom: 12px; padding: 6px 14px 10px; box-shadow: 0 1px 2px rgba(3,22,45,.04); }
      td { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 9px 0; border-bottom: 1px solid #F4F5F6; white-space: normal; text-align: right; }
      td::before { content: attr(data-label); flex: 0 0 38%; text-align: left; font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: #9CA3AF; }
      td .muted { display: block; font-weight: 500; margin-top: 2px; }
      /* First cell is the card title — the E-Tag ID is a long unbroken token,
         so it gets the full width and is allowed to wrap. */
      tr td:first-child { text-align: left; font-size: .98rem; padding: 4px 0 10px; border-bottom: 1.5px solid #EEF0F2; margin-bottom: 2px; overflow-wrap: anywhere; }
      tr td:first-child::before { display: none; }
      tr td:last-child { border-bottom: none; padding-bottom: 2px; }
      .act { justify-content: flex-end; flex-wrap: wrap; }
      .act button { padding: 8px 13px; }
      .empty, .err { text-align: center; }

      /* Modal gets the screen edges back. */
      .overlay { padding: 10px; }
      .modal { padding: 16px; max-height: 90vh; }
    }
    /* ── The filter bar stops fitting on one row here. Search takes the full
       width, the two dropdowns share the next, and the checkbox gets its own
       full-width row so it stays a comfortable tap target. ── */
    @media (max-width: 700px) {
      .bar input { flex: 1 1 100%; }
      .bar select { flex: 1 1 calc(50% - 5px); min-width: 0; }
      .check { flex: 1 1 100%; justify-content: center; }
    }
    /* ── Small phones: labels sit above values for breathing room. ── */
    @media (max-width: 420px) {
      td { flex-direction: column; align-items: stretch; gap: 3px; text-align: left; }
      td::before { flex-basis: auto; }
      .act { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <img class="brand-logo" src="/images/light-logo.png" alt="ParkTag"
             width="735" height="280" />
        <span class="brand-sep" aria-hidden="true">·</span>
        <h1 class="title">Tags</h1>
      </div>
      <a class="back" href="/admin/overview">← Back to Admin</a>
    </div>

    <div class="bar">
      <input id="q" type="search" placeholder="Search by vehicle number, E-Tag ID, sticker serial, owner email/mobile…" autocomplete="off"/>
      <select id="category" aria-label="Tag category">
        <option value="all">All tags</option>
        <option value="premium">Premium tags</option>
        <option value="etag">E-Tags</option>
      </select>
      <select id="status" aria-label="Tag status">
        <option value="">All statuses</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
      <label class="check" for="includeDeleted">
        <input id="includeDeleted" type="checkbox"/> Show deleted
      </label>
    </div>

    <p class="summary" id="summary">Loading…</p>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>E-Tag ID</th><th>Sticker serial</th><th>Vehicle</th><th>Owner</th><th>Status</th>
            <th>Plan</th><th>Contacts</th><th>Created</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="9" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <button class="closex" id="closeModal">×</button>
      <h2 id="mTitle">Logs</h2>
      <p class="sub" id="mSub"></p>
      <div id="mLogs"></div>
    </div>
  </div>

  <script src="/scripts/admin/etags.js"></script>
</body>
</html>
