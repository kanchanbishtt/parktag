<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ParkTag Admin | Tags</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/images/icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-var.woff2" crossorigin>
  <link rel="stylesheet" href="/styles/admin-shell.css?v=__ASSET_VERSION__" />
  <style>
    /* Built from one set of tokens (shared with the Activations page) and one
       breakpoint. Every row answers four questions in the same order: which
       sticker, whose vehicle, who owns it, is it working. Everything else is
       one click away under Details, where the actions live too. */
    :root {
      --bg: #F6F7F9; --surface: #fff; --subtle: #F9FAFB;
      --line: #E5E7EB; --line-soft: #F0F1F3;
      --ink: #111827; --ink-2: #374151; --ink-3: #6B7280; --ink-4: #9CA3AF;
      --accent: #FF2700;
      --ok: #16A34A; --warn: #D97706; --bad: #DC2626; --bad-ink: #B91C1C;
      --r-sm: 9px; --r: 10px; --r-lg: 14px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: Inter, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.45; overflow-x: hidden; overflow-wrap: anywhere; }
    .page { max-width: 1120px; margin: 0 auto; padding: 24px 20px 64px; }
    [hidden] { display: none !important; }

    /* Header: identical to the Activations page. */
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    /* PNG with a white background; multiply drops the white on the grey page. */
    .brand-logo { height: 34px; width: auto; aspect-ratio: 735 / 280; display: block; mix-blend-mode: multiply; }
    .title { font-size: 1.35rem; font-weight: 800; margin: 0; letter-spacing: -0.01em; white-space: nowrap; overflow-wrap: normal; }

    /* Filters: search on its own line, then who / what / state. */
    .filters { display: grid; gap: 10px; margin-bottom: 14px; }
    .search { width: 100%; height: 42px; border: 1px solid var(--line); border-radius: var(--r); padding: 0 14px; font: inherit; font-size: .92rem; background: var(--surface); }
    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { appearance: none; font: inherit; font-size: .85rem; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); height: 34px; padding: 0 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
    .chip:hover { border-color: #C9CDD3; }
    .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
    .spacer { flex: 1 1 auto; }
    .select { height: 34px; border: 1px solid var(--line); border-radius: var(--r); padding: 0 8px; font: inherit; font-size: .85rem; background: var(--surface); color: var(--ink); max-width: 100%; }
    .select.batch { max-width: 240px; }
    .search:focus, .select:focus, .chip:focus-visible, .btn:focus-visible, .more-btn:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    .summary { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; color: var(--ink-3); font-size: .86rem; margin: 0 0 10px; }
    .summary a { color: var(--ink-2); font-weight: 600; }

    /* The list: rows on a grid, never a table, so nothing scrolls sideways. */
    .list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
    .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, 1fr) 96px; gap: 16px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line-soft); }
    .row.is-deleted > :not(.details) { opacity: .6; }
    .head { border-top: 0; padding-top: 10px; padding-bottom: 10px; background: var(--subtle); font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-4); }
    .main { font-weight: 700; color: var(--ink); }
    .plate { letter-spacing: .03em; }
    .sub { font-size: .84rem; color: var(--ink-3); margin-top: 2px; }
    .sub a { color: inherit; text-decoration: none; }
    .sub a:hover { color: var(--ink); text-decoration: underline; }
    .none { color: var(--ink-4); font-weight: 500; }
    .tag { display: inline-block; font-size: .72rem; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: #ECEEF1; color: var(--ink-2); margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
    .tag.premium { background: #FEF3C7; color: #92400E; }

    /* One status per tag: a dot and a word. */
    .status { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: .9rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background: var(--ink-4); }
    .dot.active { background: var(--ok); }
    .dot.off { background: var(--warn); }
    .dot.deleted { background: var(--bad); }

    .end { display: flex; justify-content: flex-end; }
    .more-btn { appearance: none; font: inherit; font-size: .85rem; font-weight: 600; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); height: 34px; padding: 0 12px; cursor: pointer; white-space: nowrap; }
    .more-btn:hover { background: #F3F4F6; }
    .more-btn[aria-expanded="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

    /* Details: under its row, across every column. */
    .details { grid-column: 1 / -1; background: var(--subtle); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 14px; }
    .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 20px; margin: 0; font-size: .86rem; }
    .facts dt, .section-title { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-4); margin: 0 0 2px; }
    .facts dd { margin: 0; color: var(--ink-2); }
    .logs { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: .84rem; }
    .logs li { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-sm); padding: 8px 10px; color: var(--ink-2); }
    .logs .when { color: var(--ink-3); }
    .link-btn { appearance: none; border: 0; background: none; padding: 0; font: inherit; font-size: .84rem; font-weight: 600; color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 12px; border-top: 1px solid var(--line); }
    .btn { appearance: none; font: inherit; display: inline-flex; align-items: center; justify-content: center; height: 36px; padding: 0 14px; border-radius: var(--r-sm); font-size: .86rem; font-weight: 700; text-decoration: none; white-space: nowrap; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); }
    .btn:hover { background: #F3F4F6; }
    .btn.danger { color: var(--bad-ink); border-color: #FCA5A5; }
    .btn.danger:hover { background: #FEF2F2; }
    .btn.danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; }
    .btn.danger-solid:hover { background: var(--bad-ink); }
    .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
    .btn.primary:hover { background: #000; }
    .btn[disabled] { opacity: .55; cursor: default; }
    .note { font-size: .84rem; color: var(--ink-3); }
    .note.err { color: var(--bad-ink); font-weight: 600; }

    /* Page numbers, 100 tags a page (same markup as Activations → Activated). */
    .pager { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; margin-top: 16px; }
    .pager button { appearance: none; font: inherit; font-size: .86rem; font-weight: 600; min-width: 36px; height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); color: var(--ink-2); cursor: pointer; }
    .pager button:hover:not([disabled]) { background: #F3F4F6; }
    .pager button[aria-current="page"] { background: var(--ink); border-color: var(--ink); color: #fff; }
    .pager button[disabled] { opacity: .4; cursor: default; }
    .pager button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .pager .gap { color: var(--ink-4); padding: 0 2px; }

    .empty { padding: 44px 18px; text-align: center; color: var(--ink-3); }
    .empty .btn { margin-top: 12px; }

    /* Confirmation for anything that changes what a scan does. */
    dialog { border: 0; border-radius: var(--r-lg); padding: 0; width: min(440px, calc(100vw - 32px)); color: var(--ink); box-shadow: 0 20px 50px rgba(17, 24, 39, .25); }
    dialog::backdrop { background: rgba(17, 24, 39, .45); }
    .dialog-body { padding: 20px 20px 16px; }
    .dialog-body h2 { margin: 0 0 8px; font-size: 1.05rem; }
    .dialog-body p { margin: 0; color: var(--ink-2); font-size: .92rem; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 18px; }

    /* One breakpoint, set by content: four text columns need about 170px each
       plus the button, so below 900px each row becomes a card: sticker and
       status on the first line, then vehicle and owner, then Details. Unsold
       stock has no vehicle or owner, so its card skips those lines.
       Measured on the content area, not the window: the admin sidebar takes
       240px of it on anything wider than a phone. */
    .pt-admin-main { container-type: inline-size; }
    @container (max-width: 900px) {
      .page { padding: 16px 14px 48px; }
      .title { font-size: 1.15rem; }
      .brand-logo { height: 28px; }
      .search { font-size: 16px; height: 44px; }
      .spacer { display: none; }
      .filter-row.selects { display: grid; grid-template-columns: 1fr 1fr; }
      .select, .select.batch { max-width: none; width: 100%; height: 40px; font-size: 16px; }
      .select.batch { grid-column: 1 / -1; }
      .list { background: transparent; border: 0; border-radius: 0; overflow: visible; }
      .head { display: none; }
      .row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "sticker status" "vehicle vehicle" "owner owner" "end end" "details details"; gap: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); margin-bottom: 10px; padding: 14px; }
      .c-sticker { grid-area: sticker; }
      .c-status { grid-area: status; text-align: right; }
      .c-status .status { justify-content: flex-end; }
      .c-vehicle { grid-area: vehicle; }
      .c-owner { grid-area: owner; }
      .end { grid-area: end; }
      .details { grid-area: details; }
      .is-stock .c-vehicle, .is-stock .c-owner { display: none; }
      .more-btn { width: 100%; height: 40px; }
      .facts { grid-template-columns: 1fr 1fr; }
      .actions .btn { flex: 1 1 0; height: 40px; }
    }
  </style>
</head>
<body>
  <div class="pt-admin-shell">
    <aside class="pt-admin-sidebar">
      <div class="pt-admin-brand">
        <img src="/images/light-logo.png" alt="ParkTag" class="pt-admin-brand-logo" />
        <span class="pt-admin-brand-role">Admin</span>
      </div>
      <nav class="pt-admin-nav">
        <span class="pt-admin-nav-section">Management</span>
        <a class="pt-admin-nav-item" href="/admin/overview"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/></svg> Overview</a>

        <a class="pt-admin-nav-item" href="/admin/activations"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Activations</a>

        <a class="pt-admin-nav-item" href="/admin/sticker-designer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 20h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg> Sticker Designer</a>

        <span class="pt-admin-nav-section">Monitoring</span>
        <a class="pt-admin-nav-item" href="/admin/traffic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Traffic</a>
        <a class="pt-admin-nav-item" href="/admin/owners"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="2"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Owners</a>

        <a class="pt-admin-nav-item" href="/admin/admins"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5.25 3.5 9.74 8 11 4.5-1.26 8-5.75 8-11V6l-8-4Z" stroke="currentColor" stroke-width="2"/></svg> Admin Management</a>
      </nav>
      <div class="pt-admin-sidebar-footer">
        <button id="admin-refresh-button" class="pt-admin-sidebar-btn pt-admin-btn-ghost">Refresh</button>
        <button id="admin-logout-button" class="pt-admin-sidebar-btn pt-admin-btn-danger">Sign out</button>
      </div>
    </aside>
    <main class="pt-admin-main">
  <div class="page">
    <div class="top">
      <div class="brand">
        <img class="brand-logo" src="/images/light-logo.png" alt="ParkTag" width="735" height="280" />
        <h1 class="title">Tags</h1>
      </div>
    </div>

    <div class="filters">
      <input class="search" id="q" type="search" placeholder="Search plate, name, phone or serial" autocomplete="off" aria-label="Search tags"/>
      <div class="filter-row">
        <div class="chips" id="claimChips" role="group" aria-label="Show">
          <button class="chip" type="button" data-claim="claimed" aria-pressed="true">Customer tags</button>
          <button class="chip" type="button" data-claim="unclaimed" aria-pressed="false">Unsold stock</button>
          <button class="chip" type="button" data-claim="all" aria-pressed="false">All</button>
        </div>
        <span class="spacer"></span>
      </div>
      <div class="filter-row selects">
        <select class="select" id="category" aria-label="Tag type">
          <option value="all">All types</option>
          <option value="premium">Premium</option>
          <option value="etag">E-Tag</option>
        </select>
        <!-- "deleted" is not a stored status: it adds deleted tags to the list. -->
        <select class="select" id="status" aria-label="Status">
          <option value="">Any status</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
          <option value="deleted">Include deleted</option>
        </select>
        <!-- Issued batch, by the key in its serials (PT-<key>-…). Options come
             from /api/admin/tag-batches. -->
        <select class="select batch" id="batch" aria-label="Batch">
          <option value="">All batches</option>
        </select>
      </div>
    </div>

    <p class="summary"><span id="summary" role="status">Loading…</span>
      <a id="batchCsv" href="#" download hidden>Download batch CSV</a></p>

    <div class="list" id="list">
      <div class="row head" aria-hidden="true">
        <span>Sticker</span><span>Vehicle</span><span>Owner</span><span>Status</span><span></span>
      </div>
      <div id="rows"><div class="empty">Loading…</div></div>
    </div>
    <nav class="pager" id="pager" aria-label="Pages" hidden></nav>
  </div>
    </main>
  </div>

  <dialog id="confirm" aria-labelledby="confirmTitle">
    <form method="dialog">
      <div class="dialog-body">
        <h2 id="confirmTitle"></h2>
        <p id="confirmText"></p>
      </div>
      <div class="dialog-actions">
        <button class="btn" value="cancel" autofocus>Cancel</button>
        <button class="btn" value="ok" id="confirmOk"></button>
      </div>
    </form>
  </dialog>

  <script src="/scripts/admin/shell.js?v=__ASSET_VERSION__"></script>
  <script src="/scripts/admin/pager.js?v=__ASSET_VERSION__"></script>
  <script src="/scripts/admin/etags.js?v=__ASSET_VERSION__"></script>
</body>
</html>
