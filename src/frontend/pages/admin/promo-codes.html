<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ParkTag Admin | Promo Codes</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/images/icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <style>
    * { box-sizing: border-box; }
    /* Like the other admin pages, this one carries its own overflow guard:
       codes and ids have no space to break at and would push a card past the
       viewport on a phone. */
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: #F1F1F0; color: #03162D; overflow-wrap: break-word; }
    /* Mobile-first. The bottom padding clears the floating action button, which
       is fixed and would otherwise sit on top of the last row with no way to
       scroll out from under it. */
    .wrap { max-width: 1180px; margin: 0 auto; padding: 14px 12px 110px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-logo { height: 30px; width: auto; mix-blend-mode: multiply; }
    .brand-sep { color: #9aa5b1; }
    .title { font-size: 1.15rem; margin: 0; }
    .back { color: #03162D; text-decoration: none; font-weight: 600; font-size: .9rem; }
    .back:hover { text-decoration: underline; }

    .msg { padding: 14px; border-radius: 10px; margin-bottom: 14px; font-size: .9rem; display: none; }
    .msg.err { background: #FDECEA; border: 1px solid #F5C2C0; color: #8A1F1A; display: block; }
    .msg.ok { background: #E6F6EC; border: 1px solid #B7E0C6; color: #17663A; display: block; }
    .empty { background: #fff; border: 1px dashed #CFCFCC; border-radius: 12px; padding: 26px; text-align: center; color: #667; font-size: .9rem; }

    /* Table, the same card-with-overflow shape the other list pages (Tags)
       already use -- codes and discount figures are naturally tabular, unlike
       the sticker shelf's one-per-row cards. */
    .card { background: #fff; border: 1px solid #E3E3E1; border-radius: 14px; overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .84rem; min-width: 760px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #F1F2F4; white-space: nowrap; }
    th { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: #667; background: #FAFBFC; }
    tr:last-child td { border-bottom: none; }
    .code { font-weight: 700; letter-spacing: .02em; }
    .muted { color: #667; }

    .pill { display: inline-block; font-size: .68rem; font-weight: 800; padding: 2px 9px; border-radius: 20px; }
    .pill.active { background: #E6F6EC; color: #17663A; }
    .pill.revoked { background: #EDEDEB; color: #5A5A57; }

    .act button { border: 0; border-radius: 8px; padding: 6px 12px; font-size: .78rem; font-weight: 700; cursor: pointer; font-family: inherit; background: #FDECEA; color: #8A1F1A; }
    .act button:hover:not(:disabled) { background: #F5C2C0; }
    .act button:disabled { background: #EDEDEB; color: #B5B5B1; cursor: not-allowed; }

    /* A revoked row stays in the table rather than being removed -- it dims
       instead, so it still answers "what was this code worth" without reading
       as something a buyer could still use. */
    tr.is-revoked { opacity: .55; }

    /* Floating "new code" action, the same fixed pill the Field Demo shelf
       uses, so the two list-with-an-add-sheet pages behave alike. */
    .fab { position: fixed; right: 14px; z-index: 20; display: flex; align-items: center; gap: 8px;
           bottom: calc(16px + env(safe-area-inset-bottom, 0px));
           min-height: 54px; padding: 0 20px 0 16px; border: 0; border-radius: 999px; cursor: pointer;
           background: #FF2700; color: #fff; font-size: .98rem; font-weight: 700; font-family: inherit;
           box-shadow: 0 6px 20px rgba(255, 39, 0, .34), 0 2px 6px rgba(3, 22, 45, .18); }
    .fab:hover { background: #E62300; }
    .fab:focus-visible { outline: 3px solid #03162D; outline-offset: 2px; }
    .fab svg { flex: none; }

    dialog.sheet { border: 0; border-radius: 14px; padding: 0; width: min(440px, calc(100vw - 24px));
                   max-height: calc(100vh - 32px); overflow-y: auto;
                   box-shadow: 0 18px 50px rgba(3, 22, 45, .28); color: #03162D; }
    dialog.sheet::backdrop { background: rgba(3, 22, 45, .45); }
    .sheet-body { padding: 20px; }
    .sheet h2 { margin: 0 0 4px; font-size: 1.08rem; }
    .sheet .sub { margin: 0 0 16px; font-size: .86rem; color: #667; line-height: 1.45; }
    .sheet label { display: block; font-size: .8rem; font-weight: 700; text-transform: uppercase;
                   letter-spacing: .04em; color: #5A5A57; margin-bottom: 6px; }
    .sheet label.spaced { margin-top: 16px; }
    .sheet input[type="text"], .sheet input[type="number"], .sheet select {
      width: 100%; padding: 12px 14px; font-size: 1rem; font-family: inherit;
      border: 1px solid #D6D6D3; border-radius: 10px; background: #fff; color: #03162D;
    }
    .sheet input:focus, .sheet select:focus { outline: 2px solid #FF2700; outline-offset: -1px; }
    .sheet .hint { font-size: .78rem; color: #8A8A86; margin-top: 6px; line-height: 1.4; }
    /* Only the field the selected mode actually uses is shown -- flat and
       per_unit price in rupees, percent prices in a percentage, and showing
       both would invite a value being typed into the one the mode ignores. */
    .sheet [data-mode-field] { display: none; }

    .sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
    .sheet-actions button { flex: 1 1 0; min-height: 48px; border: 0; border-radius: 10px;
                            font-size: .95rem; font-weight: 700; font-family: inherit; cursor: pointer; }
    .sheet-actions .cancel { background: #EDEDEB; color: #03162D; }
    .sheet-actions .submit { background: #FF2700; color: #fff; }
    .sheet-actions .submit:disabled { background: #D9D9D6; color: #7A7A76; cursor: not-allowed; }
    .sheet-msg { font-size: .86rem; margin-top: 14px; display: none; line-height: 1.45; }
    .sheet-msg.err { display: block; color: #8A1F1A; }

    @media (max-width: 380px) {
      .wrap { padding: 12px 10px 104px; }
      .title { font-size: 1.05rem; }
      .brand-logo { height: 26px; }
      .fab { padding: 0 16px 0 13px; font-size: .92rem; }
      .sheet-body { padding: 16px; }
      .sheet-actions { flex-wrap: wrap; }
    }

    /* Narrow screens: stack each row into a labelled card, the same treatment
       the Tags table already uses once it stops fitting one line. */
    @media (max-width: 820px) {
      .card { background: transparent; border: none; overflow: visible; border-radius: 0; }
      table, tbody, tr, td { display: block; width: 100%; }
      table { min-width: 0; }
      thead { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
      tr { background: #fff; border: 1px solid #E3E3E1; border-radius: 14px; margin-bottom: 12px; padding: 6px 14px 10px; }
      td { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 9px 0; border-bottom: 1px solid #F4F5F6; white-space: normal; text-align: right; }
      td::before { content: attr(data-label); flex: 0 0 38%; text-align: left; font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: #9CA3AF; }
      tr td:first-child { text-align: left; font-size: .98rem; padding: 4px 0 10px; border-bottom: 1.5px solid #EEF0F2; margin-bottom: 2px; overflow-wrap: anywhere; }
      tr td:first-child::before { display: none; }
      tr td:last-child { border-bottom: none; padding-bottom: 2px; }
    }

    @media (min-width: 720px) {
      .wrap { padding: 22px 18px 120px; }
      .top { gap: 12px; margin-bottom: 18px; }
      .fab { right: 20px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); min-height: 56px; font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <img class="brand-logo" src="/images/light-logo.png" alt="ParkTag" width="735" height="280" />
        <span class="brand-sep" aria-hidden="true">·</span>
        <h1 class="title">Promo Codes</h1>
      </div>
      <a class="back" href="/admin/overview">← Back to Admin</a>
    </div>

    <div id="msg" class="msg"></div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Code</th><th>Discount</th><th>Shipping</th><th>Free ship above</th>
            <th>Uses</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <button id="add-fab" class="fab" type="button" aria-haspopup="dialog">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    New code
  </button>

  <dialog id="add-sheet" class="sheet" aria-labelledby="add-title">
    <form id="add-form" method="dialog" class="sheet-body">
      <h2 id="add-title">Create a promo code</h2>
      <p class="sub">
        A code covers a negotiated price. What it is actually worth is decided
        here; the buyer only ever types the code.
      </p>

      <label for="add-code">Code</label>
      <input id="add-code" type="text" placeholder="OMAXE100" autocomplete="off"
             spellcheck="false" autocapitalize="characters" />

      <label for="add-mode" class="spaced">Discount mode</label>
      <select id="add-mode">
        <option value="flat">Flat amount off the order</option>
        <option value="per_unit">Amount off, per unit</option>
        <option value="percent">Percent off</option>
      </select>

      <div data-mode-field="flat,per_unit">
        <label for="add-discount-rupees" class="spaced">Discount (₹)</label>
        <input id="add-discount-rupees" type="number" inputmode="decimal" min="0" step="1" placeholder="50" />
      </div>

      <div data-mode-field="percent">
        <label for="add-discount-percent" class="spaced">Discount (%)</label>
        <input id="add-discount-percent" type="number" inputmode="decimal" min="0" max="100" step="1" placeholder="10" />
      </div>

      <label for="add-shipping-rupees" class="spaced">Shipping fee override (₹, optional)</label>
      <input id="add-shipping-rupees" type="number" inputmode="decimal" min="0" step="1" placeholder="Leave blank to use the catalogue's own" />

      <label for="add-free-ship-rupees" class="spaced">Free shipping above (₹, optional)</label>
      <input id="add-free-ship-rupees" type="number" inputmode="decimal" min="0" step="1" placeholder="Leave blank for none" />

      <label for="add-products" class="spaced">Packs this code applies to (optional)</label>
      <input id="add-products" type="text" placeholder="pt-car-1, pt-car-2" autocomplete="off" />
      <p class="hint">Comma-separated pack ids. Leave blank for every pack.</p>

      <p id="add-msg" class="sheet-msg"></p>

      <div class="sheet-actions">
        <button type="button" class="cancel" id="add-cancel">Cancel</button>
        <button type="submit" class="submit" id="add-submit">Create code</button>
      </div>
    </form>
  </dialog>

  <script src="/scripts/admin/promo-codes.js?v=__ASSET_VERSION__"></script>
</body>
</html>
