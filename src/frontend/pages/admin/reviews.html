<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ParkTag Admin | Reviews</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/images/icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/admin-shell.css?v=__ASSET_VERSION__" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: #F1F1F0; color: #03162D; overflow-wrap: break-word; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 14px 12px 40px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-logo { height: 30px; width: auto; mix-blend-mode: multiply; }
    .brand-sep { color: #9aa5b1; }
    .title { font-size: 1.15rem; margin: 0; }
    .sub { color: #667; font-size: .85rem; margin: 0 0 14px; }
    .empty, .err { background: #fff; border: 1px dashed #CFCFCC; border-radius: 12px; padding: 26px; text-align: center; color: #667; font-size: .9rem; }
    .err { color: #8A1F1A; border-color: #F5C2C0; }
    .review { display: grid; grid-template-columns: 1fr 140px; gap: 14px; background: #fff; border: 1px solid #E3E3E1; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .review.is-approved { border-color: #B7E0C6; }
    .review p { margin: 0 0 8px; line-height: 1.45; }
    .meta { color: #667; font-size: .78rem; margin-bottom: 10px; }
    .review img { width: 140px; aspect-ratio: 1; object-fit: cover; border-radius: 10px; background: #F1F1F0; }
    .toggle { border: 0; border-radius: 8px; padding: 7px 14px; font-size: .8rem; font-weight: 700; cursor: pointer; font-family: inherit; background: #03162D; color: #fff; }
    .is-approved .toggle { background: #EDEDEB; color: #03162D; }
    .pill { display: inline-block; font-size: .68rem; font-weight: 800; padding: 2px 9px; border-radius: 20px; background: #E6F6EC; color: #17663A; margin-left: 6px; }
    @media (max-width: 520px) { .review { grid-template-columns: 1fr; } .review img { width: 100%; } }
  </style>
</head>
<body>

        <a class="pt-admin-nav-item" href="/admin/etags"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 7a2 2 0 0 1 2-2h6l8 8a2 2 0 0 1 0 2.8l-4.2 4.2a2 2 0 0 1-2.8 0L4 12V7Z" stroke="currentColor" stroke-width="2"/><circle cx="7.5" cy="9.5" r="1.5" fill="currentColor"/></svg> Tags</a>
        <a class="pt-admin-nav-item" href="/admin/activations"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Activations</a>

        <a class="pt-admin-nav-item" href="/admin/print-queue"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Print Queue</a>

        <a class="pt-admin-nav-item" href="/admin/marketing"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 11v2a1 1 0 0 0 1 1h2l4 4V6L6 10H4a1 1 0 0 0-1 1Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M16 8.5a4 4 0 0 1 0 7M19 5.5a8 8 0 0 1 0 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Field Demo</a>
        <span class="pt-admin-nav-section">Monitoring</span>
        <a class="pt-admin-nav-item" href="/admin/traffic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Traffic</a>
        <a class="pt-admin-nav-item" href="/admin/owners"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="2"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Owners</a>
        <a class="pt-admin-nav-item" href="/admin/activity"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M22 12h-4l-3 9L9 3l-3 9H2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Activity Feed</a>
        <a class="pt-admin-nav-item" href="/admin/admins"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5.25 3.5 9.74 8 11 4.5-1.26 8-5.75 8-11V6l-8-4Z" stroke="currentColor" stroke-width="2"/></svg> Admin Management</a>
      </nav>
      <div class="pt-admin-sidebar-footer">
        <button id="admin-refresh-button" class="pt-admin-sidebar-btn pt-admin-btn-ghost">Refresh</button>
        <button id="admin-logout-button" class="pt-admin-sidebar-btn pt-admin-btn-danger">Sign out</button>
      </div>
    </aside>
    <main class="pt-admin-main">
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <img class="brand-logo" src="/images/light-logo.png" alt="ParkTag" width="735" height="280" />
        <span class="brand-sep" aria-hidden="true">·</span>
        <h1 class="title">Reviews</h1>
      </div>
    </div>
    <p class="sub">Replies to the WhatsApp review request, newest first. Approved ones are served by /api/shop/reviews.</p>
    <div id="reviews"><p class="empty">Loading…</p></div>
  </div>
    </main>
  </div>
  <script src="/scripts/admin/shell.js?v=__ASSET_VERSION__"></script>
