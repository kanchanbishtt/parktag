<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParkTag Sticker</title>
  <style>
    /* Artwork SVG coordinate system is 1585 x 987; QR is placed as a % of that
       box so it stays correctly positioned at any print size. */
    * { margin: 0; box-sizing: border-box; }
    body { background: #cfd3da; font-family: "Segoe UI", system-ui, sans-serif; }

    .toolbar {
      display: flex; align-items: center; gap: 14px; justify-content: center;
      padding: 14px; background: #03162D; color: #fff;
    }
    .toolbar button {
      background: #FF2700; color: #fff; border: none; border-radius: 10px;
      padding: 9px 18px; font-size: 0.9rem; font-weight: 700; cursor: pointer;
    }
    .toolbar .url { font-size: 0.78rem; color: #9fb0c7; word-break: break-all; }

    .sheet { display: flex; justify-content: center; padding: 28px 16px; }

    .sticker {
      position: relative;
      width: 1585px; height: 987px;   /* screen size; overridden for print below */
      max-width: 100%;
      aspect-ratio: 1585 / 987;
    }
    .sticker .bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    /* QR overlay — % of the artwork box so it scales with the sticker */
    .sticker .qr {
      position: absolute;
      left: 63.91%; top: 14.49%;
      width: 26.18%; aspect-ratio: 1;
    }
    .sticker .qr svg, .sticker .qr img { width: 100%; height: 100%; display: block; }

    @media print {
      /* One sticker per page, sized to the physical sticker. Adjust to your real
         die-cut size; aspect must stay 1585:987 (≈1.606). */
      @page { size: 105mm 65.4mm; margin: 0; }
      html, body { background: #fff; }
      .toolbar { display: none; }
      .sheet { padding: 0; }
      .sticker { width: 105mm; height: 65.4mm; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button onclick="window.print()">🖨 Print sticker</button>
    <span class="url">QR → __SCAN_URL__</span>
  </div>
  <div class="sheet">
    <div class="sticker">
      <img class="bg" src="/images/org-premium-bg.svg" alt="ParkTag sticker">
      <div class="qr"><!--QR--></div>
    </div>
  </div>
</body>
</html>
