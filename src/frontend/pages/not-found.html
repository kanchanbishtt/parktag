<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>ParkTag | Page not found</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/images/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-var.woff2" crossorigin>
    <link rel="stylesheet" href="/styles/not-found.css?v=__ASSET_VERSION__" />
  </head>
  <!-- Served for any page address the app does not have (see the not-found
       handler in app.js), instead of Fastify's raw JSON. A scanner standing at
       a car is the person most likely to land here, so the first way out is
       scanning the sticker again. -->
  <body class="nf-body">
    <header class="nf-head">
      <a href="https://parktag.me" aria-label="ParkTag home"><img src="/images/dark-logo-336.webp" width="336" height="126" alt="ParkTag" class="nf-logo" /></a>
    </header>
    <main class="nf-main">
      <section class="nf-card">
        <p class="nf-code">Page not found</p>
        <h1 class="nf-title">This page is not available</h1>
        <p class="nf-text">If you were contacting a vehicle owner, please scan the QR code on the ParkTag sticker again with your phone camera.</p>
        <div class="nf-actions">
          <a class="nf-btn nf-btn-primary" href="https://parktag.me">Go to ParkTag</a>
          <a class="nf-btn" href="/owner-login">Owner sign in</a>
        </div>
      </section>
    </main>
  </body>
</html>
