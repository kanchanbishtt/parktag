<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ParkTag | You are offline</title>
  <meta name="theme-color" content="#03162D" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <!-- Everything on this page is inline on purpose. The service worker keeps
       one copy of this file and shows it when the phone has no connection, so
       a stylesheet or script it had to fetch would simply not arrive. -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; background: #F1F1F0; color: #03162D;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 360px; width: 100%; }
    .mark {
      width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%;
      background: #03162D; color: #fff; display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #4B5563; line-height: 1.5; }
    a.btn {
      display: inline-block; padding: 13px 26px; border-radius: 12px;
      background: #03162D; color: #fff; text-decoration: none; font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.56 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>You are offline</h1>
    <p>ParkTag needs a connection to show your tags, calls and alerts. Check your network and try again.</p>
    <a class="btn" href="/owner">Try again</a>
  </main>
</body>
</html>
