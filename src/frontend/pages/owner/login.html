<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ParkTag | Owner Sign In</title>
    <link rel="stylesheet" href="/styles/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body { opacity: 0; }

      #login-skeleton {
        position: fixed; inset: 0; z-index: 999;
        background: #f3f5f8;
        display: flex; flex-direction: column;
      }
      #login-skeleton .sk-header {
        height: 64px; background: #03162D;
        display: flex; align-items: center; padding: 0 20px;
      }
      #login-skeleton .sk-logo {
        width: 120px; height: 28px; border-radius: 6px;
        background: rgba(255,255,255,0.12);
      }
      #login-skeleton .sk-body {
        flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px;
      }
      #login-skeleton .sk-card {
        background: #fff; border-radius: 20px;
        padding: 28px 24px; width: 100%; max-width: 420px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.07);
        display: flex; flex-direction: column; gap: 14px;
      }
      .sk-bar {
        border-radius: 6px; background: #e5e7eb;
        animation: sk-shimmer 1.2s ease-in-out infinite;
      }
      @keyframes sk-shimmer {
        0%,100% { opacity: 1; } 50% { opacity: 0.45; }
      }
      #login-skeleton.fade-out {
        opacity: 0; transition: opacity 180ms ease;
      }
    </style>
    <script>
      // Show skeleton immediately, fade it out once DOM is ready
      document.addEventListener("DOMContentLoaded", () => {
        document.body.style.opacity = "1";
        const sk = document.getElementById("login-skeleton");
        if (sk) {
          sk.classList.add("fade-out");
          setTimeout(() => sk.remove(), 200);
        }
      });
    </script>
  </head>
  <body class="pt-hub-body">

    <!-- Skeleton shown instantly while page assets load -->
    <div id="login-skeleton">
      <div class="sk-header">
        <div class="sk-logo sk-bar"></div>
      </div>
      <div class="sk-body">
        <div class="sk-card">
          <div class="sk-bar" style="width:44px;height:44px;border-radius:50%;align-self:center;margin-bottom:4px"></div>
          <div class="sk-bar" style="width:55%;height:20px;align-self:center"></div>
          <div class="sk-bar" style="width:80%;height:14px;align-self:center"></div>
          <div class="sk-bar" style="width:100%;height:46px;border-radius:12px;margin-top:6px"></div>
          <div class="sk-bar" style="width:100%;height:46px;border-radius:12px"></div>
          <div class="sk-bar" style="width:40%;height:12px;align-self:center;margin-top:8px"></div>
          <div class="sk-bar" style="width:100%;height:46px;border-radius:12px"></div>
        </div>
      </div>
    </div>

    <header class="pt-header">
      <div class="pt-logo">
        <a href="https://parktag.me" aria-label="ParkTag home" style="display:inline-flex;align-items:center;text-decoration:none"><img src="/images/dark-logo.png" alt="ParkTag" style="height:42px;width:auto;mix-blend-mode:lighten;"></a>
      </div>
    </header>

    <main class="pt-auth-main">
      <div class="pt-auth-card">
        <div class="pt-card-icon pt-icon-tag" style="margin-bottom:12px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <h1 class="pt-card-title" id="card-title">Owner Sign In</h1>
        <p class="pt-card-sub" id="card-sub" style="margin-bottom:20px">Enter your email or mobile number and we'll send you a verification code.</p>

        <div class="pt-form" id="owner-form-step1">
          <label class="pt-field">
            <span id="identifier-label">Email or mobile number</span>
            <div style="position:relative">
              <input id="owner-identifier" type="text" class="pt-input"
                placeholder="Enter email or mobile number"
                autocomplete="username"
                inputmode="email" />
              <span id="identifier-badge" style="
                position:absolute;right:10px;top:50%;transform:translateY(-50%);
                font-size:0.7rem;font-weight:700;letter-spacing:0.04em;
                background:#F3F4F6;color:#6B7280;border:1px solid #E5E7EB;
                border-radius:20px;padding:2px 8px;pointer-events:none;
                display:none
              "></span>
            </div>
          </label>
          <button id="owner-login-button" class="pt-btn pt-btn-primary pt-btn-full" style="margin-top:4px">Continue</button>
        </div>

        <p id="owner-auth-status" class="pt-status" data-tone="info" style="padding:12px 0 0;text-align:center"></p>

        <div id="phone-step2" style="display:none;margin-top:4px">
          <span id="phone-sent-to" style="display:none"></span>
          <label class="pt-field">
            <span>Verification code</span>
            <input id="phone-otp-inp" type="text" class="pt-input"
              placeholder="000000" maxlength="6" inputmode="numeric"
              style="text-align:center;font-size:1.4rem;letter-spacing:0.25em;font-weight:700"/>
          </label>
          <button id="phone-verify-btn" class="pt-btn pt-btn-primary pt-btn-full" style="margin-top:8px">Verify</button>
          <p style="text-align:center;margin-top:12px;margin-bottom:0;font-size:0.85rem;color:#6B7280">
            Didn't receive the code?
            <button id="phone-resend-btn" style="background:none;border:none;color:#FF2700;font-weight:700;font-size:0.85rem;cursor:pointer;padding:0;font-family:inherit">Resend</button>
          </p>
          <p style="text-align:center;margin-top:8px;margin-bottom:0;font-size:0.85rem;color:#6B7280">
            Know your password?
            <button id="use-password-btn" style="background:none;border:none;color:#FF2700;font-weight:700;font-size:0.85rem;cursor:pointer;padding:0;font-family:inherit">Sign in with password</button>
          </p>
          <p style="text-align:center;margin-top:8px;margin-bottom:0">
            <a href="#" id="phone-back-btn" style="font-size:0.85rem;color:#FF2700;font-weight:600;text-decoration:none">← Back to sign in</a>
          </p>
        </div>

        <div id="password-step" style="display:none;margin-top:4px">
          <label class="pt-field">
            <span>Password</span>
            <input id="password-inp" type="password" class="pt-input" placeholder="Enter your password" autocomplete="current-password"/>
          </label>
          <label style="display:flex;align-items:center;gap:9px;margin-top:10px;cursor:pointer;user-select:none">
            <input id="remember-me" type="checkbox" style="width:16px;height:16px;accent-color:#FF2700;cursor:pointer" />
            <span style="font-size:0.84rem;font-weight:600;color:#374151">Remember me on this device</span>
          </label>
          <button id="password-login-btn" class="pt-btn pt-btn-primary pt-btn-full" style="margin-top:12px">Sign in</button>
          <p style="text-align:center;margin-top:12px;margin-bottom:0">
            <a href="#" id="password-back-btn" style="font-size:0.85rem;color:#FF2700;font-weight:600;text-decoration:none">← Back to verification code</a>
          </p>
        </div>

      </div>
    </main>

    <script type="module" src="/scripts/owner/login.js"></script>
    <script src="/scripts/ux-feedback.js"></script>
</body>
</html>
