<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>ParkTag | Membership</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/images/icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles/styles.css?v=__ASSET_VERSION__"/>
  <link rel="stylesheet" href="/styles/owner-membership.css?v=__ASSET_VERSION__"/>
    <script src="/pt-analytics.js" data-surface="billing" defer></script>
</head>
<body>

<header class="mb-header">
  <!-- data-back: see scripts/owner/smart-back.js — returns to the previous page
       rather than always forcing the dashboard. href is the no-history fallback. -->
  <a href="/owner-welcome#profile" class="mb-back" aria-label="Back" data-back>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
  <div class="mb-logo">
    <a href="https://parktag.me" aria-label="ParkTag home" style="display:inline-flex;align-items:center;text-decoration:none">
      <img src="/images/light-logo.png" alt="ParkTag" style="height:42px;width:auto;">
    </a>
  </div>
  <span></span>
</header>

<div class="mb-wrap">
  <section class="mb-hero">
    <h1 class="mb-title">
      <span class="mb-title-ic" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 2.4l2.86 5.79 6.39.93-4.62 4.5 1.09 6.37L12 16.98l-5.72 3.01 1.09-6.37-4.62-4.5 6.39-.93L12 2.4z" fill="currentColor"/></svg>
      </span>
      Membership
    </h1>
    <p class="mb-sub">Become a member, you would love it.</p>

    <!-- The length comes from the server constant, never typed here: the
         dashboard once carried a hardcoded "45 days" that stayed wrong for a
         whole release after the window was widened.

         The number carries the offer. Leading with an icon here was decorating
         the trial instead of stating it: nobody skims past the length. -->
    <section class="mb-trial" aria-label="Free trial">
      <span class="mb-trial-num">
        <span id="mbTrialDays" class="mb-trial-days mb-sk mb-sk-days">&nbsp;</span>
        <!-- Filled from the server alongside the numeral. It was the literal
             word DAYS, which silently became a lie the moment the window
             changed; the unit and the number now travel together. -->
        <span class="mb-trial-unit" id="mbTrialUnit"></span>
      </span>
      <div class="mb-trial-bd">
        <p class="mb-trial-t">
          Free trial
          <!-- Held back until the number beside it is known. A FREE badge next
               to a blank shimmer reads as a broken offer. -->
          <span class="mb-trial-tag" id="mbTrialTag" hidden>FREE</span>
        </p>
        <p class="mb-trial-s"><span id="mbTrialNote" class="mb-sk mb-sk-note">&nbsp;</span></p>
      </div>
    </section>
  </section>

  <h2 class="mb-h">Choose Your Plan</h2>
  <div class="mb-plans" id="mbPlans" role="radiogroup" aria-label="Membership plans" aria-busy="true">
    <div class="mb-sk mb-sk-plan" aria-hidden="true"></div>
    <div class="mb-sk mb-sk-plan" aria-hidden="true"></div>
    <div class="mb-sk mb-sk-plan" aria-hidden="true"></div>
  </div>

  <h2 class="mb-h">Premium Features</h2>
  <!-- Ten, because ten is what the default tag type shows. A skeleton of the
       wrong length is still a layout shift, just an earlier one. -->
  <div class="mb-feats" id="mbFeats" aria-busy="true">
    <div class="mb-sk mb-sk-feat" aria-hidden="true"></div>
    <div class="mb-sk mb-sk-feat" aria-hidden="true"></div>
    <div class="mb-sk mb-sk-feat" aria-hidden="true"></div>
    <div class="mb-sk mb-sk-feat" aria-hidden="true"></div>
    <div class="mb-sk mb-sk-feat" aria-hidden="true"></div>
    <div class="mb-sk mb-sk-feat" aria-hidden="true"></div>
    <div class="mb-sk mb-sk-feat" aria-hidden="true"></div>
    <div class="mb-sk mb-sk-feat" aria-hidden="true"></div>
    <div class="mb-sk mb-sk-feat" aria-hidden="true"></div>
    <div class="mb-sk mb-sk-feat" aria-hidden="true"></div>
  </div>

  <p class="mb-note" id="mbNote" hidden></p>
</div>

<!-- Sticky, like the reference. The label follows the selected plan, so the
     price on the button is always the price of the card that is lit. -->
<div class="mb-cta-bar">
  <button class="mb-cta" id="mbCta" type="button" disabled>
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M13 2 4.5 13H11l-1 9 8.5-11H12l1-9z" fill="currentColor"/></svg>
    <span id="mbCtaText">Go Pro</span>
  </button>
</div>

<!-- ── Payment confirmation ────────────────────────────────────────────────
     A membership is a thing somebody just paid for, and the acknowledgement
     was a grey sentence in the note panel — the same panel that had been
     showing them a plan comparison a second earlier. The shop's purchase
     already opens a full confirmation (.pt-conf-ov in welcome.html); this is
     the same moment on this screen, built in the same shape.

     Deliberately not dismissible by tapping outside or pressing Escape: this
     carries the order number, and closing it by accident is losing a receipt.
     The button is the way out. -->
<div class="mb-done" id="mbDone" hidden role="dialog" aria-modal="true" aria-labelledby="mbDoneTitle">
  <div class="mb-done-card">
    <div class="mb-done-check" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <h2 class="mb-done-title" id="mbDoneTitle">Thank you for being a member</h2>
    <p class="mb-done-sub" id="mbDoneSub"></p>

    <p class="mb-done-until" id="mbDoneUntil" hidden></p>
    <p class="mb-done-ord" id="mbDoneOrd" hidden></p>

    <ul class="mb-done-benes" id="mbDoneBenes">
      <li><span class="mb-done-bico" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="#16A34A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Unlimited masked calls &amp; WhatsApp</li>
      <li><span class="mb-done-bico" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="#16A34A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>PIN-locked document vault</li>
      <li><span class="mb-done-bico" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="#16A34A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Emergency SOS contact</li>
    </ul>

    <button class="mb-done-btn" id="mbDoneBtn" type="button">Done</button>
  </div>
</div>

<!-- Razorpay's checkout sheet. Loaded from checkout.razorpay.com, which this
     page's CSP allows and the other strict pages deliberately do not — see
     PAYMENT_STRICT_PAGES in app.js. Not deferred: membership.js only calls
     new Razorpay() from a click, long after this has parsed. -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="/scripts/owner/smart-back.js?v=__ASSET_VERSION__"></script>
<script src="/scripts/owner/session-guard.js?v=__ASSET_VERSION__" defer></script>
<script type="module" src="/scripts/owner/membership.js?v=__ASSET_VERSION__"></script>
</body>
</html>
